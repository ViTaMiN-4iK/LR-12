name: AI PR summary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build diff
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          git fetch origin "$BASE" --depth=250
          git diff "origin/${BASE}...HEAD" > pr.diff || git diff HEAD~1...HEAD > pr.diff

      - name: Summarize and comment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional repo variables: GEMINI_MODEL, GEMINI_MAX_DIFF_CHARS (see script docstring; defaults: gemini-2.5-flash-lite, 24000)
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_MAX_DIFF_CHARS: ${{ vars.GEMINI_MAX_DIFF_CHARS }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PR_DIFF_FILE: pr.diff
        run: python .github/scripts/pr_ai_summary.py
