# Runtime configuration lives in a gitignored `.env` at repo root (see `.env.example`).
# This file avoids credential-like YAML keys so secret scanners (GitGuardian, etc.) stay quiet.
services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db

volumes:
  pgdata:
